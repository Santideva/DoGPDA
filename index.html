<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DoG Bump Mapping with Three.js</title><script defer="defer" src="bundle.js"></script></head><body><div id="controls"><label for="mapType">Map Type:</label> <select id="mapType"><option value="bump">Bump</option><option value="normal">Normal</option><option value="albedo">Albedo</option><option value="emission">Emission</option></select><div id="file-selection"><label for="imageFile">Select Image:</label> <input type="file" id="imageFile" accept="image/*"/><div id="image-preview"></div></div><div id="parameter-panel"></div><button id="applyChanges">Apply</button> <button id="download-current" disabled="disabled">Download Map</button></div></body></html>
