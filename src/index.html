<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoG Bump Mapping with Three.js</title>
  </head>
  <body>
    <!-- Single Sidebar Controls -->
    <div id="controls">
      <!-- Map type selector -->
      <label for="mapType">Map Type:</label>
      <select id="mapType">
        <option value="bump">Bump</option>
        <option value="normal">Normal</option>
        <option value="albedo">Albedo</option>
        <option value="emission">Emission</option>
      </select>

      <!-- Image file selection and preview -->
      <div id="file-selection">
        <label for="imageFile">Select Image:</label>
        <input type="file" id="imageFile" accept="image/*" />
        <div id="image-preview"></div>
      </div>

      <!-- Dynamic parameter panel -->
      <div id="parameter-panel"></div>

      <!-- Apply and download buttons -->
      <button id="applyChanges">Apply</button>
      <button id="download-current" disabled>Download Map</button>
    </div>

    <!-- WebGL canvas is injected by the renderer -->
    <!-- No other static control panels; everything is dynamic -->

    <!-- Scripts are injected by build tooling -->
  </body>
</html>
